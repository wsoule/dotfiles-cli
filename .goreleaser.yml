project_name: dotfiles

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: dotfiles
    binary: dotfiles
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: >-
      {{- .ProjectName }}-
      {{- .Version }}-
      {{- .Os }}-
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

brews:
  - name: dotfiles
    description: "Modern dotfiles management system built in Go"
    homepage: "https://github.com/wyatsoule/go-dotfiles"
    license: "MIT"
    repository:
      owner: wyatsoule
      name: homebrew-tap
    folder: Formula
    dependencies:
      - gnu-stow
    install: |
      bin.install "dotfiles"
    test: |
      system "#{bin}/dotfiles", "--version"
    caveats: |
      🎉 dotfiles installed successfully!

      📚 Quick Start:
        dotfiles onboard              # Complete setup for new developers
        dotfiles setup <repo-url>     # Setup from existing dotfiles repo
        dotfiles tui                  # Interactive package manager

      ✨ Enable shell completion:
        # For zsh:
        mkdir -p ~/.zsh_completions
        dotfiles completion zsh > ~/.zsh_completions/_dotfiles
        echo 'fpath=("$HOME/.zsh_completions" $fpath)' >> ~/.zshrc
        echo 'autoload -Uz compinit && compinit' >> ~/.zshrc
        source ~/.zshrc

        # For bash:
        mkdir -p ~/.bash_completions
        dotfiles completion bash > ~/.bash_completions/dotfiles
        echo 'source "$HOME/.bash_completions/dotfiles"' >> ~/.bashrc
        source ~/.bashrc

      📖 Full documentation: https://github.com/wyatsoule/go-dotfiles

nfpms:
  - id: packages
    package_name: dotfiles
    file_name_template: '{{ .ConventionalFileName }}'
    vendor: "{{ .Env.GITHUB_USERNAME }}"
    homepage: "https://github.com/{{ .Env.GITHUB_USERNAME }}/{{ .ProjectName }}"
    maintainer: "{{ .Env.GITHUB_USERNAME }} <{{ .Env.GITHUB_EMAIL }}>"
    description: "Modern dotfiles management system built in Go"
    license: "MIT"
    formats:
      - deb
      - rpm
    dependencies:
      - stow

release:
  github:
    owner: wyatsoule
    name: go-dotfiles
  draft: false
  prerelease: auto
  name_template: "{{ .ProjectName }} {{ .Version }}"
  header: |
    ## What's New

    {{ .Version }} brings exciting new features and improvements to your dotfiles management experience.
  footer: |
    ## Installation

    ### Homebrew (macOS/Linux)
    ```bash
    brew install wyatsoule/tap/dotfiles
    ```

    ### Direct Download
    Download the binary for your platform from the [releases page](https://github.com/wyatsoule/go-dotfiles/releases).

    ### Go Install
    ```bash
    go install github.com/wyatsoule/go-dotfiles@latest
    ```